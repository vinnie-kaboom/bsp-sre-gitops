apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: test-asm-us-staging-6.0.0-on-boarding
  namespace: messaging
spec:
  interval: 5m
  chart:
    spec:
      # Chart: https://github.com/ncr-bsp/bsp-sre-gitops/tree/on-board-helm-submodules/helm/bsp-messaging
      chart: ./helm/bsp-messaging
      sourceRef:
        kind: GitRepository
        name: on-board-helm-submodules
        namespace: messaging
      interval: 1m
  values:
    releaseNamePostfix: test-asm600
    gitRepo:
      repoName: messaging-core-test-config
      helmBaseDirectory: messaging/build/core/helm
      ref:
        branch: namer-staging-6.0.0
    region: us
    environment: staging
    coreAppName: test-asm
    helmRelease:
      valuesFiles:
        - messaging/build/core/helm/messaging-gcp/values.yaml
        - messaging/build/core/helm/messaging-gcp/overrides/us-staging.yaml
        - helm/overrides/business-services-platform-staging.yaml
    alert:
      channel: core-gitops