apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: pubsub-processor-on-boarding
  namespace: cnm
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: cnm
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: cnm
    releaseName: pubsub-processor-apac-prd
    applicationName: pubsub-processor
    gitRepo:
      repoName: promotion-execution-config
      ref:
        branch: apac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      timeout: 100m
      valuesFiles:
        - helm/pubsub-processor/values.yaml
        - helm/pubsub-processor/overrides/values-apac-prod.yaml
    alert:
      channel: bsp-apac-prd-flux-applications
