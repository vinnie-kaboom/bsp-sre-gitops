apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tdm-application-on-boarding
  namespace: data
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: data
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: data
    releaseName: tdm-application-apac-prd
    applicationName: tdm-application
    gitRepo:
      repoName: tdm-app-config
      ref:
        branch: apac-prd-env-config
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/tdm-application/values.yaml
        - helm/tdm-application/overrides/apac-prd.yaml
    alert:
      channel: bsp-apac-prd-flux-applications
---
