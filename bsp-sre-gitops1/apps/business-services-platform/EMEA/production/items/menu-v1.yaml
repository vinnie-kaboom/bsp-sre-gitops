apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: menu-v1-on-boarding
  namespace: items
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: items
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: items
    releaseName: menu-v1-emea-prd
    applicationName: menu-v1
    gitRepo:
      repoName: menu-config
      ref:
        branch: emea-prd-env-config
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/menu-v1/values.yaml
        - helm/menu-v1/overrides/emea-prd.yaml
    alert:
      channel: bsp-emea-prd-flux-applications
