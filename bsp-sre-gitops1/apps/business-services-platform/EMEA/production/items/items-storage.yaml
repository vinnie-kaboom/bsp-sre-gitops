apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: items-storage-on-boarding
  namespace: items
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: items
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: items
    releaseName: items-storage-prd-emea
    applicationName: items-storage
    gitRepo:
      repoName: items-storage-config
      ref:
        branch: emea-prd-env-config
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/items-storage/values.yaml
        - helm/items-storage/overrides/apigee-emea-prd.yaml
    alert:
      channel: bsp-emea-prd-flux-applications
