apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: core-on-boarding
  namespace: core-namer-stg
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: core-namer-stg
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: core-namer-stg
    releaseName: core
    applicationName: nep-core
    gitRepo:
      repoName: nep-core-config
      ref:
        branch: namer-stg
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp          
    helmRelease:
      timeout: 60m # Needed to give other jobs time to finish.
      valuesFiles:
        - helm/nep-core/values.yaml
        - helm/nep-core/overrides/namer-stg.yaml
    alert:
      channel: core-gitops