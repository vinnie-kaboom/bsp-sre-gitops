apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: apims-export-data-onboarding
  namespace: dev-apims
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: dev-apims
      interval: 5m
  # Values overridden for this deployment
  values:
    namespace: dev-apims
    releaseName: auditing-data-export-p4uvi1w
    applicationName: export-data
    gitRepo:
      repoName: apims-data-exporter-config
      ref:
        branch: namer-dev
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/export-data/values.yaml
        - helm/export-data/overrides/rc-dev.yaml
    alert:
      channel: apims-data-exporter-gitops