apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: message-ingest-on-boarding
  namespace: notifications-namer-sandbox
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: notifications-namer-sandbox
      interval: 5m
## Values overridden for this deployment
  values:
    namespace: notifications-namer-sandbox
    releaseName: message-ingest
    applicationName: message-ingest
    gitRepo:
      repoName: core-config
      ref:
        branch: message-ingest-namer-sandbox
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp          
    helmRelease:
      valuesFiles:
        - helm/message-ingest/values.yaml
        - helm/message-ingest/overrides/namer-sandbox.yaml
    alert:
      channel: core-gitops