apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: site-security-on-boarding
  namespace: site-security-namer-sandbox
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: site-security-namer-sandbox
      interval: 5m
## Values overridden for this deployment
  values:
    namespace: site-security-namer-sandbox
    releaseName: site-security
    applicationName: site-security
    gitRepo:
      repoName: core-config
      ref:
        branch: site-security-namer-sandbox
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp          
    helmRelease:
      valuesFiles:
        - helm/site-security/values.yaml
        - helm/site-security/overrides/namer-sandbox.yaml
    alert:
      channel: core-gitops
