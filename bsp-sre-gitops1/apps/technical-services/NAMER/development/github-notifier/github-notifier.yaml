apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: github-notifier-on-boarding
  namespace: github-notifier-nonprod
spec:
  interval: 2m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: github-notifier-nonprod
      interval: 1m

  values:
    namespace: github-notifier-nonprod
    releaseName: github-notifier
    applicationName: github-notifier

    alert:
      enabled: false

    gitRepo:
      repoName: github-notifier-config
      ref:
        branch: stg-env-config
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp  
    helmRelease:
      valuesFiles:
        - helm/github-notifier/values.yaml
        - helm/github-notifier/overrides/github-notifier-stg.yaml
      values:
        namespace: github-notifier-nonprod
        acceptanceTest:
          acceptanceTestURL: kube-system
