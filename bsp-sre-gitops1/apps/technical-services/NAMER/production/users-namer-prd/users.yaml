apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: users-on-boarding
  namespace: users-namer-prd
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: users-namer-prd
      interval: 5m
## Values overridden for this deployment
  values:
    namespace: users-namer-prd
    releaseName: users
    applicationName: users
    gitRepo:
      repoName: core-config
      ref:
        branch: users-namer-prd
      secretRef:
        name: ghe-repository-auth  
      orgName: ncrvoyix-bsp    
    helmRelease:
      valuesFiles:
        - helm/users/values.yaml
        - helm/users/overrides/namer-prd.yaml
    alert:
      channel: core-gitops
