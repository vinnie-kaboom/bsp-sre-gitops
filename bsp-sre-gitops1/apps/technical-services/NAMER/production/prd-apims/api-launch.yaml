apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: api-launch-onboarding
  namespace: prd-apims
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: prd-apims
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: prd-apims
    releaseName: api-launch-service-vho85a7
    applicationName: api-launch
    gitRepo:
      repoName: api-launch-function-config
      ref:
        branch: namer-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      timeout: 60m # Needed to give cloud functions time to deploy
      valuesFiles:
        - helm/api-launch/values.yaml
        - helm/api-launch/overrides/namer-prd.yaml
    alert:
      channel: api-launch-gitops