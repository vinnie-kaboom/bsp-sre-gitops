apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: notifications-on-boarding
  namespace: notifications-napac-prd
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: notifications-napac-prd
      interval: 5m
## Values overridden for this deployment
  values:
    namespace: notifications-napac-prd
    releaseName: notifications
    applicationName: nep-notifications
    gitRepo:
      repoName: notifications-config
      ref:
        branch: napac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/nep-notifications/values.yaml
        - helm/nep-notifications/overrides/napac-prd.yaml
    alert:
      channel: core-gitops
