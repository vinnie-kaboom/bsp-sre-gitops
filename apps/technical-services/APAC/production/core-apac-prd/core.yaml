apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: core-on-boarding-apac
  namespace: prd-core
spec:
  interval: 60m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: prd-core
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: prd-core
    releaseName: core
    ## renamed from nep-core to be able to ignore helmrelease stuck in limbo
    applicationName: nep-core
    gitRepo:
      repoName: nep-core-config
      ref:
        branch: apac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      ## specify chart name since application name was changed above
      chart: nep-core
      timeout: 55m # Needed to give other jobs time to finish.
      interval: 60m
      valuesFiles:
        - helm/nep-core/values.yaml
        - helm/nep-core/overrides/apac-prd.yaml
    alert:
      channel: core-gitops
