apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: apims-teams-onboarding
  namespace: prd-apims
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: prd-apims
      interval: 5m
  # Values overridden for this deployment
  values:
    namespace: prd-apims
    releaseName: teams-6s3kp9g
    applicationName: apims-teams
    gitRepo:
      repoName: apims-teams-config
      ref:
        branch: apac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/apims-teams/values.yaml
        - helm/apims-teams/overrides/apac/apac-prd-override.yaml
    alert:
      channel: apims-teams-gitops
