apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: delivery-on-boarding
  namespace: ordering
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: ordering
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: ordering
    releaseName: delivery-emea-prd
    applicationName: delivery
    gitRepo:
      repoName: delivery-config
      ref:
        branch: emea-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/delivery/values.yaml
        - helm/delivery/overrides/emea-prd.yaml
    alert:
      channel:
        - bsp-emea-prd-flux-applications
        - hoth-flux-prd-emea
