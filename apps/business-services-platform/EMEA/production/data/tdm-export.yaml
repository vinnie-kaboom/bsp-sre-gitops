apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tdm-export-on-boarding
  namespace: data
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: data
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: data
    releaseName: tdm-export-emea-prd
    applicationName: tdm-export
    gitRepo:
      repoName: tdm-export-config
      ref:
        branch: emea-prd-env-config
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/tdm-export/values.yaml
        - helm/tdm-export/overrides/emea-prd.yaml
    alert:
      channel: bsp-emea-prd-flux-applications
---
