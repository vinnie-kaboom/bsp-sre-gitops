apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: apims-entitlements-onboarding
  namespace: prd-apims
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: prd-apims
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: prd-apims
    releaseName: 9tgw7ah
    applicationName: apip-entitlements
    gitRepo:
      repoName: apip-entitlements-config
      ref:
        branch: napac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/apip-entitlements/values.yaml
        - helm/apip-entitlements/overrides/napac/napac-prd-override.yaml
    alert:
      channel: apims-entitlements-gitops
