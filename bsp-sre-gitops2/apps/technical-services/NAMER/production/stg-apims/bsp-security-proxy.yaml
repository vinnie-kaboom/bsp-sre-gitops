apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: bsp-security-proxy-onboarding
  namespace: stg-apims
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: stg-apims
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: stg-apims
    releaseName: bsp-security-proxy-mih8fqi
    applicationName: bsp-security-proxy
    gitRepo:
      repoName: bsp-security-proxy-config
      ref:
        branch: namer-stg
      secretRef:
        name: ghe-repository-auth  
      orgName: ncrvoyix-bsp      
    helmRelease:
      valuesFiles:
        - helm/bsp-security-proxy/values.yaml
        - helm/bsp-security-proxy/overrides/namer/namer-stg-override.yaml
    alert:
      channel: shared-flow-gitops