apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: bsp-security-proxy-onboarding
  namespace: rc-dev-apims
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: rc-dev-apims
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: rc-dev-apims
    releaseName: bsp-security-proxy
    applicationName: bsp-security-proxy
    gitRepo:
      repoName: bsp-security-proxy-config
      ref:
        branch: namer-rc-dev
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/bsp-security-proxy/values.yaml
        - helm/bsp-security-proxy/overrides/rc/rc-dev-override.yaml
    alert:
      channel: shared-flow-gitops