apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: fulfillment-time-on-boarding
  namespace: ordering
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: ordering
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: ordering
    releaseName: fulfillment-time-apac-prd
    applicationName: fulfillment-time
    gitRepo:
      repoName: fulfillment-time-config
      ref:
        branch: apac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/fulfillment-time/values.yaml
        - helm/fulfillment-time/overrides/apac-prd.yaml
    alert:
      channel:
        - bsp-apac-prd-flux-applications
        - hoth-flux-prd-apac
