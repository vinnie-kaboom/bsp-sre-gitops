
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tdm-expiration-processor-on-boarding
  namespace: data
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: data
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: data
    releaseName: tdm-expiration-processor-apac-prd
    applicationName: tdm-expiration-processor
    gitRepo:
      repoName: tdm-expiration-processor-config
      ref:
        branch: apac-prd-env-config
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/tdm-expiration-processor/values.yaml
        - helm/tdm-expiration-processor/overrides/apac-prd.yaml
    alert:
      channel: bsp-apac-prd-flux-applications
