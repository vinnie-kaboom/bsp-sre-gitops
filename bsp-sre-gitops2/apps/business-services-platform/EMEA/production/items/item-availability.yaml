apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: item-availability-on-boarding
  namespace: items
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: items
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: items
    releaseName: item-availability-prd-emea
    applicationName: item-availability
    gitRepo:
      repoName: item-availability-config
      ref:
        branch: emea-prd-env-config
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/item-availability/values.yaml
        - helm/item-availability/overrides/apigee-emea-prd.yaml
    alert:
      channel: bsp-emea-prd-flux-applications
