apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: apims-analytics-onboarding
  namespace: prd-apims
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: prd-apims
      interval: 5m
  # Values overridden for this deployment
  values:
    namespace: prd-apims
    releaseName: analytics-blz0c0g
    applicationName: analytics
    gitRepo:
      repoName: apims-analytics-config
      ref:
        branch: napac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/analytics/values.yaml
        - helm/analytics/overrides/napac-prd.yaml
    alert:
      channel: apims-analytics-gitops
