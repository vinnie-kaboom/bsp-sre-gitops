apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: segment-on-boarding
  namespace: cnm
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/bsp-applications
      sourceRef:
        kind: GitRepository
        name: ghe-on-board-helm
        namespace: cnm
      interval: 5m
  ## Values overridden for this deployment
  values:
    namespace: cnm
    releaseName: segment-apac-prd
    applicationName: segment
    gitRepo:
      repoName: consumer-data-management-config
      ref:
        branch: apac-prd
      secretRef:
        name: ghe-repository-auth
      orgName: ncrvoyix-bsp
    helmRelease:
      valuesFiles:
        - helm/segment/values.yaml
        - helm/segment/overrides/values-apac-prod.yaml
    alert:
      channel: bsp-apac-prd-flux-applications
